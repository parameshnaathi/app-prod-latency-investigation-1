apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: sre-lab
spec:
  replicas: 3

  selector:
    matchLabels:
      app: checkout

  template:
    metadata:
      labels:
        app: checkout

    spec:
      containers:
        - name: checkout
          image: checkout-app:v2
          imagePullPolicy: IfNotPresent
          
          env:
            - name: DEPENDENCY_URL
              value: "http://dependency/work"
        
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5