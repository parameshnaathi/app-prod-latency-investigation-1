apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency
  namespace: sre-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dependency

  template:
    metadata:
      labels:
        app: dependency

    spec:
      containers:
        - name: dependency
          image: dependency-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5